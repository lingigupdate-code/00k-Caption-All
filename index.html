<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Captions</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9B2D7">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#F9B2D7;
  --accent2:#CFECF3;
}

body[data-theme="Fashion"]{ --accent:#F9B2D7; --accent2:#CFECF3; }
body[data-theme="Beauty"]{ --accent:#CFECF3; --accent2:#DAF9DE; }
body[data-theme="EyeWear"]{ --accent:#DAF9DE; --accent2:#F6FFDC; }
body[data-theme="PFW"]{  --accent:#D9C2FF;  --accent2:#FFE8F5;}
body[data-theme="Cartier"]{ --accent:#F6FFDC; --accent2:#F9B2D7; }

body{
  margin:0;
  color:#111;
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  min-height:100vh;
  overflow-x:hidden;
  box-sizing:border-box;
  background-attachment:fixed;
  background-color:#000;
}

#cursorGlow{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  filter:blur(40px);
  mix-blend-mode:screen;
  z-index:1;
}

/* 🎨 dynamic backgrounds */
body[data-theme="Fashion"]{ background-color:#1d1b1c; background-image: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)), url("https://lingigupdate-code.github.io/00k-Caption/image/fashion.jpg"); background-size:contain; background-position:center center; background-repeat:no-repeat; background-attachment:fixed; }
body[data-theme="Beauty"]{ background-color:#d9d0cf; background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url("https://lingigupdate-code.github.io/00k-Caption/image/beauty.jpg"); background-size:contain; background-position:center center; background-repeat:no-repeat; background-attachment:fixed; }
body[data-theme="EyeWear"]{ background-color:#cfc7b8; background-image: linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.20)), url("https://lingigupdate-code.github.io/00k-Caption/image/eyewear.jpg"); background-size:contain; background-position:center center; background-repeat:no-repeat; background-attachment:fixed; }
body[data-theme="PFW"]{ background-color:#2a2328; background-image: linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.30)), url("https://lingigupdate-code.github.io/00k-Caption/image/pfw.jpg"); background-size:contain; background-position:center center; background-repeat:no-repeat; background-attachment:fixed; }
body[data-theme="Cartier"]{ background-color:#b8aa8c; background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url("https://lingigupdate-code.github.io/00k-Caption/image/cartier.jpg"); background-size:contain; background-position:center center; background-repeat:no-repeat; background-attachment:fixed; }

/* card */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:14px;
  background:rgba(255,255,255,0.01);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  padding:20px;
  height:auto;
  max-height:92vh;
  overflow-y:auto;
  box-sizing:border-box;
  box-shadow: 0 8px 32px rgba(0,0,0,0.10);
}

h1{ font-family:'Outfit',sans-serif; font-weight:600; margin:0; color:#fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); letter-spacing:.5px; }
.status{ font-size:12px; color:rgba(255,255,255,.78); letter-spacing:.3px; }

.campaign-slider{ display:flex; overflow-x:auto; gap:14px; padding:4px 22px; scroll-snap-type:x mandatory; scroll-padding:22px; }
.campaign-slider::-webkit-scrollbar{display:none;}
.campaign-item{ flex:0 0 64%; padding:14px; border-radius:18px; background:rgba(255,255,255,0.06); color:rgba(255,255,255,.78); backdrop-filter:blur(8px); transform:scale(.88); opacity:.72; transition:.3s; border:1px solid rgba(255,255,255,0.10); scroll-snap-align:center; }
.campaign-item.active{ transform:scale(1); opacity:1; background:rgba(255,255,255,.72); color:#111; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }

.platform-row{ display:flex; gap:10px; }
.platform-btn{ flex:1; text-align:center; font-size:14px; padding:10px 0; border-radius:20px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.08); backdrop-filter:blur(8px); color:#fff; }
.platform-btn.active{ background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#000; }

.actions{ display:flex; gap:10px; }
.main-btn{ flex:1; padding:14px; border-radius:20px; border:none; background:#000; color:#fff; font-weight:600; cursor: pointer;}
.copy-btn{ flex:.6; }

/* result */
.result{
  min-height: 80px;
  max-height:260px;
  overflow-y:auto;
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,0.10);
  white-space:pre-line;
  opacity:0;
  color:#fff;
  line-height:1.7;
  text-shadow: 0 1px 10px rgba(0,0,0,.25);
  transition: opacity 0.3s;
}
.result.show{ opacity:1; }

.brand-tabs{ display:flex; gap:12px; width:100%; }
.brand-btn{ flex:1; padding:13px 0; border-radius:20px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); backdrop-filter:blur(10px); color:rgba(255,255,255,.78); font-weight:600; text-align:center; transition:.28s ease; }
.brand-btn.active{ color:#111; background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.55)); border:1px solid rgba(255,255,255,.28); transform:translateY(-1px); }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); padding:12px 22px; border-radius:999px; background:rgba(255,255,255,0.14); backdrop-filter:blur(5px); border:1px solid rgba(255,255,255,0.16); color:#fff; font-size:14px; font-weight:600; opacity:0; pointer-events:none; z-index:9999; transition: 0.3s; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* 🌀 Spinner */
.spinner {
  width: 24px; height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-left-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 10px auto;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>

<body data-theme="Fashion">
<div id="cursorGlow"></div>

<div class="card">
  <h1>00K CAPTIONS</h1>

  <div class="brand-tabs">
    <button class="brand-btn active" onclick="setBrand('Dior',this)">Dior</button>
    <button class="brand-btn" onclick="setBrand('Cartier',this)">Cartier</button>
  </div>

  <div class="status" id="statusText">Fashion • IG</div>
  <div class="campaign-slider" id="slider">
    <div class="campaign-item active" data-c="Dior_Fashion" onclick="selectCampaign(this)">Fashion</div>
    <div class="campaign-item" data-c="Dior_Beauty" onclick="selectCampaign(this)">Beauty</div>
    <div class="campaign-item" data-c="Dior_EyeWear" onclick="selectCampaign(this)">Eyewear</div>
    <div class="campaign-item" data-c="Dior_PFW" onclick="selectCampaign(this)">PFW</div>
    <div class="campaign-item" data-c="Cartier" onclick="selectCampaign(this)">Cartier</div>
  </div>

  <div class="platform-row">
    <button class="platform-btn active" onclick="setPlatform('IG',this)">IG</button>
    <button class="platform-btn" onclick="setPlatform('X',this)">X</button>
  </div>

  <div class="actions">
    <button class="main-btn" onclick="spin()">✨ RANDOM</button>
    <button class="main-btn copy-btn" onclick="copy()">COPY</button>
  </div>

  <div id="loadingArea" class="spinner"></div>
  <div id="result" class="result"></div>
</div>

<div id="toast" class="toast">Copied</div>

<script>
let hashtagData = [];
let currentBrand = "Dior";
let currentCampaign = "Dior_Fashion";
let currentPlatform = "IG";
let isSpinning = false;

const n = t => (t || "").toLowerCase().replace(/\s|_/g, "");
const glow = { Fashion: "#F9B2D744", Beauty: "#CFECF344", EyeWear: "#DAF9DE44", PFW: "#D9C2FF44", Cartier: "#F6FFDC44" };

// --- 1. ฟังก์ชัน Prompt ที่คุณต้องการ (ปรับให้เป็น 2-3 ประโยค) ---
function getPrompt() {
  const brandName = currentCampaign.includes('Dior') ? 'Dior' : 'Cartier';
  
  // ปรับแบบที่ 2: Modern Chic (กระชับแต่หรู)
  const commonRules = `
Additional Instructions:
- Write exactly 2 sophisticated sentences.
- Keep the language high-end, modern, and chic (not too flowery).
- Ensure sentences are complete and end with a period.
- MUST include both "Lingling Kwong" and "${brandName}".
- Total length must be under 50 words.
`;

  if(currentCampaign === "Dior_Fashion"){
    return `Act as a luxury fashion editor. Write a chic 2-sentence caption for Lingling Kwong and Dior Fashion. Focus on modern luxury and iconic silhouettes. Sometimes include 1 subtle emoji.${commonRules}`;
  }

  if(currentCampaign === "Dior_Beauty"){
    return `Act as a luxury beauty editor. Write a chic 2-sentence caption for Lingling Kwong and Dior Beauty. Focus on ethereal radiance and sophisticated glow. Sometimes include beauty emoji.${commonRules}`;
  }

  if(currentCampaign === "Dior_EyeWear"){
    return `Act as a luxury fashion editor. Write a chic 2-sentence eyewear caption for Lingling Kwong and Dior. Focus on magnetic allure and modern style. Sometimes include subtle fashion emoji.${commonRules}`;
  }

  if(currentCampaign === "Dior_PFW"){
    return `Act as a fashion editor. Write a chic 2-sentence Paris Fashion Week caption for Lingling Kwong and Dior. Focus on front-row elegance and Parisian charm.${commonRules}`;
  }

  if(currentCampaign === "Cartier"){
    return `Act as a jewelry editor. Write a chic 2-sentence jewelry caption for Lingling Kwong and Cartier. Focus on timeless prestige and exquisite brilliance. Sometimes include elegant emoji.${commonRules}`;
  }
}

// --- 2. ฟังก์ชัน SPIN (เรียกใช้ getPrompt) ---
async function spin() {
  if (isSpinning) return;
  isSpinning = true;

  const resEl = document.getElementById("result");
  const spinner = document.getElementById("loadingArea");
  
  resEl.classList.remove("show");
  resEl.innerText = "Crafting your luxury story...";
  spinner.style.display = "block";

  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGyOt3-U2tU8TeZXWsKGpR-aB2oeFr7J6UTJmJ7taqUPH0APt2S1jco_I982lJd84_/exec";

  try {
    const response = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ prompt: getPrompt() }) // เปลี่ยนเป็น getPrompt() ตรงนี้
    });

    const data = await response.json();
    let aiText = (data.text || "").trim();
    
    const tags = getAllTags();
    resEl.innerText = aiText + "\n\n" + tags;
    resEl.classList.add("show");
    resEl.scrollTop = 0;

  } catch (err) {
    resEl.innerText = "Connection error. Please try again.";
    resEl.classList.add("show");
  } finally {
    spinner.style.display = "none";
    isSpinning = false;
  }
}

// --- ฟังก์ชันอื่นๆ คงเดิม ---
function updateStatus() {
  let label = currentCampaign.replace("Dior_", "").replace("_", " ");
  document.getElementById("statusText").innerText = label + " • " + currentPlatform;
}

function theme(c) {
  let t = "Fashion";
  if (c === "Dior_Fashion") t = "Fashion";
  else if (c === "Dior_Beauty") t = "Beauty";
  else if (c === "Dior_EyeWear") t = "EyeWear";
  else if (c === "Dior_PFW") t = "PFW";
  else if (c === "Cartier") t = "Cartier";
  document.body.dataset.theme = t;
  const cursorGlow = document.getElementById("cursorGlow");
  if (cursorGlow) cursorGlow.style.background = `radial-gradient(circle, ${glow[t]}, transparent 60%)`;
}

function setBrand(brand, btn) {
  currentBrand = brand;
  document.querySelectorAll(".brand-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const items = document.querySelectorAll(".campaign-item");
  let firstVisible = null;
  items.forEach(i => {
    const c = i.dataset.c;
    let show = (brand === "Dior" && c.startsWith("Dior")) || (brand === "Cartier" && c === "Cartier");
    i.style.display = show ? "block" : "none";
    if (show && !firstVisible) firstVisible = i;
  });
  if (firstVisible) selectCampaign(firstVisible);
}

function selectCampaign(element) {
  if (!element) return;
  currentCampaign = element.dataset.c;
  document.querySelectorAll(".campaign-item").forEach(i => i.classList.remove("active"));
  element.classList.add("active");
  element.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  theme(currentCampaign);
  updateStatus();
}

function setPlatform(p, btn) {
  currentPlatform = p;
  document.querySelectorAll(".platform-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  updateStatus();
}

fetch("https://script.google.com/macros/s/AKfycbxGyOt3-U2tU8TeZXWsKGpR-aB2oeFr7J6UTJmJ7taqUPH0APt2S1jco_I982lJd84_/exec")
  .then(r => r.json())
  .then(d => { hashtagData = d.hashtags || []; })
  .catch(err => console.error("Fetch Error:", err));

function getAllTags() {
  const list = hashtagData.filter(h => 
    n(h.brand) === n(currentBrand) &&
    n(h.campaign) === n(currentCampaign) &&
    n(h.platform) === n(currentPlatform)
  );
  return list.map(h => h.hashtags).join(" ");
}

function copy() {
  const text = document.getElementById("result").innerText;
  if(!text) return;
  navigator.clipboard.writeText(text);
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1600);
}

const slider = document.getElementById("slider");
slider.addEventListener("scroll", () => {
  let mid = window.innerWidth / 2;
  let best = null;
  let dist = 9999;
  document.querySelectorAll(".campaign-item").forEach(i => {
    if (i.style.display === "none") return;
    let r = i.getBoundingClientRect();
    let d = Math.abs(mid - (r.left + r.width / 2));
    if (d < dist) { dist = d; best = i; }
  });
  if (best && best.dataset.c !== currentCampaign) {
    currentCampaign = best.dataset.c;
    document.querySelectorAll(".campaign-item").forEach(i => i.classList.remove("active"));
    best.classList.add("active");
    theme(currentCampaign);
    updateStatus();
  }
});

updateStatus();
theme(currentCampaign);
</script>

</body>
</html>
